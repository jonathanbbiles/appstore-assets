<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>App Store assets</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --dim:#666; --line:#e3e3e3; --bg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --dim:#999; --line:#333; --bg:#141414; } }
  body { margin:0; padding:2rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  p.lede { color:var(--dim); margin:0 0 2rem; max-width:60ch; }
  h2 { font-size:1.1rem; margin:2.5rem 0 .25rem; text-transform:capitalize; }
  .meta { color:var(--dim); font-size:.85rem; margin:0 0 1rem; }
  .meta a { color:inherit; }
  .slot { font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
          border-top:1px solid var(--line); padding-top:.75rem; margin-top:1.5rem; }
  .shots { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:1rem; margin-top:.75rem; }
  .shots figure { margin:0; }
  .shots img { width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:6px; background:var(--line); }
  .shots figcaption { font-size:.72rem; color:var(--dim); margin-top:.35rem; word-break:break-all; }
  code { font-size:.85em; background:color-mix(in srgb, var(--fg) 8%, transparent); padding:.1em .35em; border-radius:3px; }
  .empty { color:var(--dim); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>App Store assets</h1>
  <p class="lede">Screenshot sets for Jonathan Biles' apps, published so App Store Connect can be
  fed from a URL instead of a manual upload. Each app's <code>manifest.json</code> is what CI reads.</p>

  <div id="apps"><p class="empty">Loading…</p></div>
</main>

<script>
// Add an app slug here after its first publish.
const APPS = ["tassel"];

const el = document.getElementById("apps");

(async () => {
  const parts = [];
  for (const app of APPS) {
    let man;
    try {
      const r = await fetch(`./${app}/manifest.json`, { cache: "no-cache" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      man = await r.json();
    } catch (e) {
      parts.push(`<h2>${app}</h2><p class="empty">No manifest yet (${e.message}).</p>`);
      continue;
    }

    const total = Object.values(man.slots).reduce((n, s) => n + s.screenshots.length, 0);
    let html = `<h2>${app}</h2>
      <p class="meta">${total} screenshot(s) &middot;
        <a href="./${app}/manifest.json">manifest.json</a></p>`;

    for (const [slot, s] of Object.entries(man.slots).sort()) {
      html += `<div class="slot">${slot} &middot; ${s.expect_pixels} &middot; ${s.asc_display_target}</div>
               <div class="shots">`;
      for (const shot of s.screenshots) {
        html += `<figure>
                   <a href="./${app}/${slot}/${shot.file}">
                     <img src="./${app}/${slot}/${shot.file}" alt="${app} ${slot} ${shot.file}" loading="lazy">
                   </a>
                   <figcaption>${shot.file}</figcaption>
                 </figure>`;
      }
      html += `</div>`;
    }
    parts.push(html);
  }
  el.innerHTML = parts.join("");
})();
</script>
</body>
</html>
